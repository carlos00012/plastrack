<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3faf9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9d70"/>
      <stop offset="1" stop-color="#0b7fab"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b3b45" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#78a6b0"/>
    </marker>
  </defs>

  <rect width="1600" height="820" fill="url(#bg)"/>
  <g opacity="0.5" fill="#cfe4e8">
    <circle cx="1520" cy="80" r="2"/><circle cx="1560" cy="80" r="2"/><circle cx="1480" cy="80" r="2"/>
    <circle cx="1520" cy="120" r="2"/><circle cx="1560" cy="120" r="2"/><circle cx="1480" cy="120" r="2"/>
  </g>

  <text x="80" y="78" font-size="34" font-weight="700" fill="#082a36">Arquitectura de la solución PlasTrack</text>
  <text x="80" y="112" font-size="18" fill="#5d7d88">Inteligencia de negocios estática · del JSON de Copernicus al tablero público</text>
  <rect x="80" y="132" width="86" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Conectores -->
  <g stroke="#a9c5cc" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M342 352 H382"/>
    <path d="M700 352 H740"/>
    <path d="M1192 352 H1232"/>
  </g>
  <text x="348" y="338" font-size="12.5" fill="#6f9099">JSON</text>

  <!-- 01 Datos -->
  <text x="82" y="196" font-size="12.5" font-weight="700" fill="#0f9d70" letter-spacing="2">01 · DATOS</text>
  <rect x="80" y="214" width="262" height="278" rx="18" fill="#ffffff" stroke="#d7e5e9" filter="url(#shadow)"/>
  <rect x="80" y="214" width="262" height="7" rx="3.5" fill="#0f9d70"/>
  <g transform="translate(112 256)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#e7f7f1"/>
    <path d="M14 30h16a7 7 0 0 0 1-13.9A10 10 0 0 0 11 14a7.5 7.5 0 0 0 3 16z" fill="none" stroke="#0f9d70" stroke-width="2.2"/>
  </g>
  <text x="172" y="286" font-size="19" font-weight="700" fill="#082a36">Fuente de datos</text>
  <text x="112" y="330" font-size="15" fill="#41616c">Copernicus Data Space</text>
  <text x="112" y="356" font-size="15" fill="#41616c">15 pasadas simuladas</text>
  <text x="112" y="382" font-size="15" fill="#41616c">JSON estructurado</text>
  <text x="112" y="408" font-size="15" fill="#41616c">Resolución 10 m / 30 m</text>
  <rect x="112" y="436" width="184" height="34" rx="8" fill="#f3faf9" stroke="#d7e5e9"/>
  <text x="126" y="458" font-size="12.5" fill="#5d7d88" font-family="Consolas, monospace">data_copernicus_sample.json</text>

  <!-- 02 Lógica -->
  <text x="402" y="196" font-size="12.5" font-weight="700" fill="#0b7fab" letter-spacing="2">02 · LÓGICA</text>
  <rect x="400" y="214" width="300" height="278" rx="18" fill="#ffffff" stroke="#d7e5e9" filter="url(#shadow)"/>
  <rect x="400" y="214" width="300" height="7" rx="3.5" fill="#0b7fab"/>
  <g transform="translate(432 256)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#e6f4fa"/>
    <path d="M10 22h24M22 10v24" stroke="#0b7fab" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="22" cy="22" r="16" fill="none" stroke="#0b7fab" stroke-width="2.2"/>
  </g>
  <text x="492" y="286" font-size="19" font-weight="700" fill="#082a36">Transformación</text>
  <text x="432" y="330" font-size="15" fill="#41616c">Validación de esquema</text>
  <text x="432" y="356" font-size="15" fill="#41616c">Filtros y agregaciones</text>
  <text x="432" y="382" font-size="15" fill="#41616c">Correlación de Pearson</text>
  <text x="432" y="408" font-size="15" fill="#41616c">Semáforo de aptitud</text>
  <rect x="432" y="436" width="236" height="34" rx="8" fill="#f3faf9" stroke="#d7e5e9"/>
  <text x="446" y="458" font-size="12.5" fill="#5d7d88" font-family="Consolas, monospace">analytics.js · funciones puras</text>

  <!-- 03 Visualización -->
  <text x="742" y="196" font-size="12.5" font-weight="700" fill="#0f9d70" letter-spacing="2">03 · VISUALIZACIÓN</text>
  <rect x="740" y="214" width="452" height="278" rx="18" fill="#ffffff" stroke="#d7e5e9" filter="url(#shadow)"/>
  <rect x="740" y="214" width="452" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="772" y="264" font-size="19" font-weight="700" fill="#082a36">Dashboard PlasTrack</text>
  <text x="772" y="288" font-size="14" fill="#5d7d88">HTML5 + CSS3 + JavaScript (ES Modules)</text>

  <g>
    <rect x="772" y="310" width="190" height="70" rx="12" fill="#f3faf9" stroke="#d7e5e9"/>
    <text x="790" y="340" font-size="14" font-weight="600" fill="#082a36">Tarjetas KPI</text>
    <text x="790" y="362" font-size="12.5" fill="#5d7d88">5 indicadores dinámicos</text>

    <rect x="978" y="310" width="182" height="70" rx="12" fill="#f3faf9" stroke="#d7e5e9"/>
    <text x="996" y="340" font-size="14" font-weight="600" fill="#082a36">Mapa Leaflet</text>
    <text x="996" y="362" font-size="12.5" fill="#5d7d88">marcadores + heatmap</text>

    <rect x="772" y="392" width="190" height="70" rx="12" fill="#f3faf9" stroke="#d7e5e9"/>
    <text x="790" y="422" font-size="14" font-weight="600" fill="#082a36">Chart.js</text>
    <text x="790" y="444" font-size="12.5" fill="#5d7d88">tendencia · barras · dona</text>

    <rect x="978" y="392" width="182" height="70" rx="12" fill="#f3faf9" stroke="#d7e5e9"/>
    <text x="996" y="422" font-size="14" font-weight="600" fill="#082a36">Tabla auditable</text>
    <text x="996" y="444" font-size="12.5" fill="#5d7d88">búsqueda · orden · CSV</text>
  </g>

  <!-- 04 Despliegue -->
  <text x="1232" y="196" font-size="12.5" font-weight="700" fill="#0b7fab" letter-spacing="2">04 · ENTREGA</text>
  <rect x="1230" y="214" width="290" height="278" rx="18" fill="#ffffff" stroke="#d7e5e9" filter="url(#shadow)"/>
  <rect x="1230" y="214" width="290" height="7" rx="3.5" fill="#0b7fab"/>
  <g transform="translate(1262 256)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#e7f7f1"/>
    <path d="M12 12h20v20H12z" fill="none" stroke="#0f9d70" stroke-width="2.2"/>
    <path d="M18 32V20h8v12" fill="none" stroke="#0f9d70" stroke-width="2.2"/>
  </g>
  <text x="1322" y="286" font-size="19" font-weight="700" fill="#082a36">Despliegue</text>
  <text x="1262" y="330" font-size="15" fill="#41616c">GitHub Pages</text>
  <text x="1262" y="356" font-size="15" fill="#41616c">HTTPS + CDN global</text>
  <text x="1262" y="382" font-size="15" fill="#41616c">URL pública</text>
  <text x="1262" y="408" font-size="15" fill="#41616c">Sin backend ni cookies</text>
  <rect x="1262" y="436" width="226" height="34" rx="8" fill="#f3faf9" stroke="#d7e5e9"/>
  <text x="1276" y="458" font-size="12.5" fill="#5d7d88">build estático · CI por Git</text>

  <!-- Transversales -->
  <rect x="80" y="552" width="1440" height="92" rx="16" fill="#082a36"/>
  <text x="112" y="592" font-size="13" font-weight="700" fill="#3ddc97" letter-spacing="2">ATRIBUTOS TRANSVERSALES</text>
  <g font-size="14" fill="#dfeeec">
    <text x="112" y="620">Accesibilidad WCAG 2.2 AA</text>
    <text x="480" y="620">Diseño mobile-first</text>
    <text x="780" y="620">Cero dependencias de servidor</text>
    <text x="1120" y="620">Trazabilidad de datos</text>
  </g>
  <g fill="#3ddc97">
    <circle cx="100" cy="615" r="3"/><circle cx="468" cy="615" r="3"/><circle cx="768" cy="615" r="3"/><circle cx="1108" cy="615" r="3"/>
  </g>

  <text x="80" y="700" font-size="13.5" fill="#5d7d88">Flujo: el navegador descarga el JSON, lo valida, aplica filtros en memoria y actualiza los cuatro componentes sin recargar la página.</text>
  <text x="80" y="726" font-size="13.5" fill="#5d7d88">El mismo repositorio contiene el dashboard y la documentación; cada push a la rama principal publica una nueva versión.</text>

  <g transform="translate(1400 690)">
    <rect width="120" height="34" rx="17" fill="#e7f7f1"/>
    <text x="18" y="22" font-size="12.5" font-weight="600" fill="#0f7a58">v1.0 · 2026</text>
  </g>
</svg>
